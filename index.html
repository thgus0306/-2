<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9f1fa"><title>키오스크 주문 연습</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:#eaf0f6;color:#14233b}main{max-width:1000px;margin:auto;padding:18px}.panel{background:white;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px #1c355014}header{text-align:center}h1{font-size:clamp(28px,4vw,44px);margin:0 0 8px}h2{font-size:clamp(25px,3vw,34px);margin:0 0 16px}.lead{font-size:clamp(21px,2.8vw,28px);font-weight:750;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.menu{border:3px solid #dce4ed;border-radius:20px;padding:16px;text-align:center;background:#fff}.menu.picked{border-color:#e38a13;background:#fff2b8}.emoji{font-size:clamp(70px,11vw,112px);line-height:1.25}.name,.price{font-size:clamp(24px,3.3vw,34px);font-weight:850;margin:8px 0}.price{color:#204b83}button{font:inherit;font-weight:850;border:0;border-radius:15px;min-height:62px;padding:13px 19px;cursor:pointer;font-size:clamp(20px,2.5vw,27px);touch-action:manipulation}button:focus-visible{outline:5px solid #e8a526;outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#1764b2;color:white}.secondary{background:#e6edf4;color:#193453}.danger{background:#fff0ed;color:#9d281e}.wide{width:100%;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.item{border-bottom:2px solid #e7ebef;padding:16px 0}.item:last-child{border-bottom:0}.item-title{font-size:clamp(21px,2.8vw,28px);font-weight:850}.muted{color:#51647c;font-size:19px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.smallbtn{min-width:65px;min-height:60px}.number{font-size:30px;font-weight:900;min-width:40px;text-align:center}.summary{background:#edf5ff;border-radius:18px;padding:18px;margin-top:18px}.big{font-size:clamp(30px,4.7vw,48px);font-weight:900}.notice{text-align:center;font-size:18px;color:#4c5c70;font-weight:700;padding:10px}.center{text-align:center}.paychoice{border:4px solid #dce4ed;background:#f6f9fd;min-height:200px;width:100%}.paychoice.selected{border-color:#e38a13;background:#fff0b0}.payicon{font-size:70px;display:block}.money-card{border-radius:18px;padding:16px;background:#f4f7fa;text-align:center}.money-card svg{width:100%;max-width:240px;height:115px}.cash-count{font-size:32px;font-weight:900;margin:10px}.cash-label{font-size:25px;font-weight:850}.hint{background:#fff0b0;border-radius:16px;padding:17px;text-align:center}.success{color:#187246}.step{font-size:20px;font-weight:800;color:#51647c}.hidden{display:none!important}@media(max-width:520px){main{padding:10px}.panel{padding:15px}.grid{gap:9px}.menu{padding:9px}button{padding:10px}.controls{gap:7px}.smallbtn{min-width:55px}.money-card{padding:9px}}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.98)}}
</style></head><body><main><header class="panel"><h1>🛒 키오스크 주문 연습</h1><p class="lead" id="subtitle">먹고 싶은 간식을 골라요.</p><div class="step" id="step"></div></header><section id="screen" aria-live="polite"></section><footer class="panel notice">ℹ️ 연습용 화면이며 실제 주문과 결제는 되지 않아요.</footer></main><script>
'use strict';const menus=[{id:'chocolate',name:'초콜릿',emoji:'🍫',price:500},{id:'cookie',name:'초코과자',emoji:'🍪',price:1000},{id:'vitamin',name:'비타민',emoji:'🍊',price:300},{id:'yogurt',name:'요구르트',emoji:'🥛',price:700}];const denoms=[5000,1000,500,100];let cart={},cash={},payment='',page='menu';const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('ko-KR')+'원',items=()=>menus.filter(m=>(cart[m.id]||0)>0),total=()=>items().reduce((a,m)=>a+m.price*cart[m.id],0),qty=()=>items().reduce((a,m)=>a+cart[m.id],0),paid=()=>denoms.reduce((a,d)=>a+d*(cash[d]||0),0);function reset(){cart={};cash={};payment='';page='menu';render()}function add(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);render()}function del(id){delete cart[id];render()}function navigate(p){page=p;render();window.scrollTo(0,0)}function choose(p){payment=p;render()}function nextPayment(){if(!payment)return;if(payment==='cash'){cash={};navigate('cash')}else navigate('complete')}function addMoney(n){cash[n]=(cash[n]||0)+1;render()}function moneyArt(d){let col=d===5000?'#edba9d':'#b5d3f7',ink=d===5000?'#8b4227':'#264d83';if(d>=1000)return `<svg role="img" aria-label="${fmt(d)} 지폐 그림" viewBox="0 0 230 115"><rect x="7" y="13" width="216" height="89" rx="9" fill="${col}" stroke="${ink}" stroke-width="4"/><rect x="17" y="23" width="196" height="69" rx="6" fill="none" stroke="${ink}" stroke-dasharray="6 4"/><circle cx="115" cy="57" r="30" fill="#fff" opacity=".45"/><text x="115" y="68" font-size="32" font-weight="900" text-anchor="middle" fill="${ink}">${d.toLocaleString()}</text></svg>`;col=d===500?'#cbd1d7':'#caa17a';ink=d===500?'#465360':'#6b4329';return `<svg role="img" aria-label="${fmt(d)} 동전 그림" viewBox="0 0 230 115"><circle cx="115" cy="57" r="49" fill="${col}" stroke="${ink}" stroke-width="5"/><circle cx="115" cy="57" r="41" fill="none" stroke="#fff" stroke-width="3"/><text x="115" y="70" font-size="38" font-weight="900" text-anchor="middle" fill="${ink}">${d}</text></svg>`}function rows(){return items().map(m=>`<div class="item"><div class="row"><div><div class="item-title">${m.emoji} ${m.name} · ${cart[m.id]}개</div><div class="muted">${fmt(m.price)} × ${cart[m.id]}개</div></div><div class="item-title">${fmt(m.price*cart[m.id])}</div></div></div>`).join('')}function totals(){return `<div class="summary"><div class="row"><div class="item-title">총 수량</div><div class="item-title">${qty()}개</div></div><div class="row" style="margin-top:12px"><div class="item-title">합계 금액</div><div class="big">${fmt(total())}</div></div></div>`}function suggest(){let rest=total();return denoms.map(d=>{const n=Math.floor(rest/d);rest%=d;return {d,n}}).filter(x=>x.n>0)}function render(){const subtitle={menu:'먹고 싶은 간식을 골라요.',confirm:'주문한 간식을 확인해요.',payment:'결제 방법을 선택해요.',cash:'돈을 보고 현금 결제를 연습해요.',complete:'주문 연습을 마쳤어요!'};const steps={menu:'① 메뉴 선택',confirm:'② 주문 확인',payment:'③ 결제 방법 선택',cash:'④ 현금 결제 연습',complete:'✓ 연습 완료'};$('#subtitle').textContent=subtitle[page];$('#step').textContent=steps[page];let html='';if(page==='menu'){html=`<section class="grid panel">${menus.map(m=>`<div class="menu ${(cart[m.id]||0)>0?'picked':''}"><div class="emoji" aria-hidden="true">${m.emoji}</div><div class="name">${m.name}</div><div class="price">${fmt(m.price)}</div><button class="primary wide" onclick="add('${m.id}',1)" aria-label="${m.name} 한 개 담기">＋ 담기</button>${cart[m.id]?`<div class="item-title success">✓ ${cart[m.id]}개 담음</div>`:''}</div>`).join('')}</section><section class="panel"><h2>🛒 장바구니</h2>${qty()?items().map(m=>`<div class="item"><div class="row"><div><div class="item-title">${m.emoji} ${m.name}</div><div class="muted">${fmt(m.price)} × ${cart[m.id]}개</div></div><div class="item-title">${fmt(m.price*cart[m.id])}</div></div><div class="controls"><button class="secondary smallbtn" onclick="add('${m.id}',-1)" aria-label="${m.name} 수량 줄이기">−</button><span class="number">${cart[m.id]}</span><button class="primary smallbtn" onclick="add('${m.id}',1)" aria-label="${m.name} 수량 늘리기">＋</button><button class="danger" onclick="del('${m.id}')">삭제</button></div></div>`).join(''):'<p class="lead center">장바구니가 비어 있어요.<br>위에서 간식을 담아 주세요.</p>'}${totals()}</section><section class="panel"><button class="primary wide" ${qty()?'':'disabled'} onclick="navigate('confirm')">주문 확인 →</button><button class="secondary wide" onclick="reset()">↻ 다시 시작</button></section>`}else if(page==='confirm'){html=`<section class="panel"><h2 class="center">주문 확인</h2>${rows()}${totals()}<p class="lead center">이 메뉴들을 주문할까요?</p><button class="primary wide" onclick="navigate('payment')">주문하기 →</button><button class="secondary wide" onclick="navigate('menu')">← 다시 고르기</button></section>`}else if(page==='payment'){html=`<section class="panel center"><h2>어떻게 결제할까요?</h2><div class="grid"><button class="paychoice ${payment==='card'?'selected':''}" aria-pressed="${payment==='card'}" onclick="choose('card')"><span class="payicon">💳</span>카드${payment==='card'?'<br>✓ 선택!':''}</button><button class="paychoice ${payment==='cash'?'selected':''}" aria-pressed="${payment==='cash'}" onclick="choose('cash')"><span class="payicon">💵</span>현금${payment==='cash'?'<br>✓ 선택!':''}</button></div><div class="summary"><div class="lead">결제할 금액</div><div class="big">${fmt(total())}</div></div><button class="primary wide" ${payment?'':'disabled'} onclick="nextPayment()">다음 단계 →</button><button class="secondary wide" onclick="navigate('confirm')">← 이전 화면</button></section>`}else if(page==='cash'){html=`<section class="panel"><h2 class="center">💵 현금 결제 연습</h2><div class="hint"><div class="lead">내야 할 돈</div><div class="big">${fmt(total())}</div><div class="lead">이렇게 내면 돼요!</div></div><div class="grid" style="margin-top:16px">${suggest().map(({d,n})=>`<div class="money-card">${moneyArt(d)}<div class="cash-label">${fmt(d)}</div><div class="cash-count">${n}${d>=1000?'장':'개'}</div></div>`).join('')}</div><h2 class="center" style="margin-top:28px">돈을 눌러서 넣어 보세요.</h2><div class="grid">${denoms.map(d=>`<button class="secondary" onclick="addMoney(${d})">＋ ${fmt(d)}${cash[d]?`<br><small>${cash[d]}개 넣음</small>`:''}</button>`).join('')}</div><div class="summary"><div class="row"><span class="item-title">넣은 돈</span><span class="big">${fmt(paid())}</span></div><div class="row" style="margin-top:14px"><span class="item-title">${paid()<total()?'더 넣을 돈':'거스름돈'}</span><span class="big">${fmt(Math.abs(total()-paid()))}</span></div>${paid()>=total()?'<p class="lead success center">✓ 돈을 충분히 넣었어요!</p>':''}</div><button class="secondary wide" onclick="cash={};render()">↻ 넣은 돈 다시 시작</button><button class="primary wide" ${paid()>=total()?'':'disabled'} onclick="navigate('complete')">결제 완료 →</button><button class="secondary wide" onclick="navigate('payment')">← 이전 화면</button></section>`}else{html=`<section class="panel"><div class="center"><div style="font-size:74px">✅</div><h2>주문 연습을 마쳤어요!</h2><div class="summary"><div class="lead">연습용 주문번호</div><div class="big">001</div></div></div><h2 style="margin-top:25px">주문한 메뉴</h2>${rows()}${totals()}<div class="summary"><div class="row"><span class="item-title">결제 방법</span><span class="item-title">${payment==='card'?'💳 카드':'💵 현금'}</span></div>${payment==='cash'?`<div class="row"><span class="item-title">넣은 돈</span><span class="item-title">${fmt(paid())}</span></div><div class="row"><span class="item-title">거스름돈</span><span class="item-title">${fmt(paid()-total())}</span></div>`:''}</div><p class="lead center">🔊 번호가 불리면 음식을 받아요</p><button class="primary wide" onclick="reset()">↻ 다시 연습하기</button></section>`}$('#screen').innerHTML=html}render();
</script></body></html>
